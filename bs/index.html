<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2 - Galeri Responsif Bootstrap</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-4 p-3 border border-dark">
        <!-- BARIS ATAS: Gambar Utama + 4 Gambar Samping -->
        <div class="row g-2 mb-2">
            
            <!-- Gambar Utama (1.jpg) -->
            <div class="col-12 col-md-8">
                <img src="img/1.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Utama">
            </div>

            <!-- 4 Gambar Samping (2.jpg) -->
            <div class="col-12 col-md-4">
                <div class="row g-2">
                    <div class="col-6 col-md-6">
                        <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
                    </div>
                    <div class="col-6 col-md-6">
                        <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
                    </div>
                    <div class="col-6 col-md-6">
                        <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
                    </div>
                    <div class="col-6 col-md-6">
                        <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
                    </div>
                </div>
            </div>

        </div>

        <!-- BARIS BAWAH: 6 Gambar Kecil (2.jpg) -->
        <div class="row g-2">
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
            <div class="col-6 col-sm-4 col-md-2">
                <img src="img/2.jpg" class="img-fluid w-100 galeri-img" alt="Gambar Kecil">
            </div>
        </div>
    </div>

    <!-- Menghubungkan JS Bootstrap Lokal -->
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
